<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de pago | Psico Studios</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body { background: #e9ecf1; }
    main { max-width: 460px; margin: 0 auto; padding: 24px 16px 48px; }
    .simu-aviso { background: #fff7e0; border: 1.5px dashed #c99a1d; color: #6b5200; border-radius: 12px; padding: .9em 1em; font-size: .9rem; margin-bottom: 18px; }
    .simu-caja { background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    .simu-caja h1 { font-size: 1.15rem; color: #333; }
    .simu-monto { font-size: 2.2rem; font-weight: 800; color: #222; margin: .2em 0 .1em; }
    .simu-detalle { color: #666; font-size: .9rem; margin-bottom: 1.2em; }
    .simu-tarjeta { border: 1.5px solid #ddd; border-radius: 10px; padding: .8em 1em; color: #555; margin-bottom: 1.2em; font-size: .95rem; }
    .btn-aprobar { background: #2f7d5b; color: #fff; }
    .btn-rechazar { background: #fff; color: var(--error); border-color: var(--error); }
    .grupo { display: grid; gap: 10px; }
    .chico-gris { color: #777; font-size: .8rem; text-align: center; margin-top: 1em; }
  </style>
</head>
<body>
  <main>
    <div class="simu-aviso" role="note">
      <strong>Simulador de pago.</strong> Esto <strong>no es Mercado Pago</strong>: es una pantalla de prueba.
      En el sistema real, en este paso se abre el checkout de Mercado Pago para pagar con tarjeta o dinero en cuenta.
    </div>
    <div class="simu-caja" id="caja"><div class="cargando">Cargando…</div></div>
    <p class="chico-gris">Elegí qué pasa con el pago para ver cómo responde el sistema en cada caso.</p>
  </main>
  <script type="module">
    import { crearClienteDemo } from './js/demo.js';
    import { esc, pesos, fechaLarga, rangos } from './js/comun.js';

    const q = new URLSearchParams(location.search);
    const id = Number(q.get('pedido'));
    const token = q.get('t');
    const pagar = q.get('pagar') === 'total' ? 'total' : 'sena';
    const volver = (resultado) => { location.href = `index.html?pago=${resultado}&pedido=${id}&t=${token}`; };
    const caja = document.getElementById('caja');
    const sb = crearClienteDemo();

    const { data: r, error } = await sb.rpc('estado_pago_pedido', { p_pedido_id: id, p_token: token });
    if (error) {
      caja.innerHTML = `<h1>No encontramos la reserva</h1><p>${esc(error.hint || error.message)}</p>
        <a class="btn btn-borde btn-bloque" href="index.html">Volver a la web</a>`;
    } else {
      const monto = Math.max(0, (pagar === 'total' || r.tipo === 'fijo' ? r.total : r.sena) - r.pagado);
      const que = r.tipo === 'fijo' ? 'Primer mes del fijo' : pagar === 'total' ? 'Pago total' : 'Seña';
      caja.innerHTML = `
        <h1>Psico Studios · ${que} · pedido #${esc(r.id)}</h1>
        <div class="simu-monto">${pesos(monto)}</div>
        <div class="simu-detalle">${r.reservas.map((x) => `${esc(fechaLarga(x.fecha))}, ${esc(rangos(x.horas))} · ${esc(x.consultorio)}`).join('<br>')}</div>
        <div class="simu-tarjeta">💳 Tarjeta de prueba terminada en 4242</div>
        <div class="grupo">
          <button class="btn btn-aprobar btn-bloque" id="aprobar">Simular pago APROBADO</button>
          <button class="btn btn-borde btn-bloque" id="tarde">Simular pago aprobado pero TARDE (ya había vencido)</button>
          <button class="btn btn-rechazar btn-bloque" id="rechazar">Simular pago RECHAZADO</button>
          <button class="btn btn-borde btn-bloque" id="salir">Volver sin pagar</button>
        </div>`;
      document.getElementById('aprobar').onclick = (e) => {
        e.currentTarget.disabled = true;
        e.currentTarget.textContent = 'Procesando…';
        sb.demo.pagoAprobado(id, token, pagar);   // lo que hace el aviso de Mercado Pago (webhook)
        setTimeout(() => volver('ok'), 700);
      };
      document.getElementById('tarde').onclick = (e) => {
        e.currentTarget.disabled = true;
        sb.demo.adelantar(24 * 60);        // pasa el tiempo: la reserva vence y el horario se libera
        sb.demo.pagoAprobado(id, token, pagar);   // llega el pago: si el horario sigue libre, se recupera
        setTimeout(() => volver('ok'), 700);
      };
      document.getElementById('rechazar').onclick = () => volver('error');
      document.getElementById('salir').onclick = () => volver('error');
    }
  </script>
</body>
</html>
